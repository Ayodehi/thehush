name: Release

# Push a tag named v<minecraft_version>-<mod_build> (for example v26.2-1) and this builds the jar, checks
# the tag against gradle.properties, and publishes a GitHub Release with the jar attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against gradle.properties
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '[:space:]')
          build=$(sed -n 's/^mod_build=//p' gradle.properties | tr -d '[:space:]')
          expected="v${mc}-${build}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gradle.properties (${expected}). Bump mod_build or retag." >&2
            exit 1
          fi
          echo "version=${mc}-${build}" >> "$GITHUB_OUTPUT"
        id: version

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/thehush-${{ steps.version.outputs.version }}.jar"
          test -f "$jar"
          gh release create "${GITHUB_REF_NAME}" "$jar" \
            --title "The Hush ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "Minecraft ${{ steps.version.outputs.version }} build. Drop the jar into your mods folder with NeoForge installed, launch once, then add your Anthropic API key to config/thehush-common.toml (see the README)."
